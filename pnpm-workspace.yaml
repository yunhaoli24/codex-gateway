# Keep TypeScript on 6.x until both sides of the build toolchain support 7.x:
# vue-tsc currently imports the removed `typescript/lib/tsc` subpath, while
# @nuxtjs/i18n's compile-time source analysis reaches
# @typescript-eslint/typescript-estree, whose peer range still excludes TS 7.
# The parser is build-only and is not copied into the production runner. Do not
# upgrade TypeScript in isolation merely because `pnpm outdated` advertises 7.x.
packages:
  - "packages/*"

# Installation/postinstall owns vendor builds. Running lint must never implicitly reinstall and
# rebuild all workspace packages via pnpm's default verifyDepsBeforeRun=install behavior.
verifyDepsBeforeRun: false
minimumReleaseAgeExcludePrune: true

allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  maplibre-gl: false
  ssh2: true
  vue-demi: true

minimumReleaseAgeExclude:
